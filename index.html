<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chloe's Art Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #faf8f5;
      color: #2c2c2c;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      border-bottom: 1px solid #e8e2d9;
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: normal;
      letter-spacing: 0.05em;
      color: #3a3128;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #9a8e82;
      font-style: italic;
    }

    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.13);
    }

    .card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }

    .card-label {
      padding: 0.6rem 0.9rem;
      font-size: 0.85rem;
      color: #7a6e65;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #empty {
      display: none;
      grid-column: 1/-1;
      text-align: center;
      padding: 5rem 1rem;
      color: #b0a89e;
      font-style: italic;
    }

    /* Lightbox */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(15,12,10,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    #lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    #lightbox-img {
      max-width: min(92vw, 1100px);
      max-height: 88vh;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      transition: opacity 0.15s ease;
    }

    #lightbox-img.fading { opacity: 0; }

    .lb-btn {
      position: fixed;
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      font-size: 2.5rem;
      cursor: pointer;
      padding: 0.5rem 1rem;
      transition: color 0.15s;
      user-select: none;
      line-height: 1;
    }

    .lb-btn:hover { color: #fff; }

    #lb-close { top: 1rem; right: 1.25rem; font-size: 2rem; }
    #lb-prev  { left: 0.5rem; top: 50%; transform: translateY(-50%); font-size: 3rem; }
    #lb-next  { right: 0.5rem; top: 50%; transform: translateY(-50%); font-size: 3rem; }

    #lb-caption {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.55);
      font-size: 0.85rem;
      font-style: italic;
      pointer-events: none;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #c4bbb3;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Chloe's Art Gallery</h1>
  <p>A collection of original works</p>
</header>

<main id="gallery">
  <p id="empty">No artwork yet — check back soon!</p>
</main>

<div id="lightbox">
  <button class="lb-btn" id="lb-close" aria-label="Close">&#215;</button>
  <button class="lb-btn" id="lb-prev" aria-label="Previous">&#8249;</button>
  <img id="lightbox-img" src="" alt="">
  <button class="lb-btn" id="lb-next" aria-label="Next">&#8250;</button>
  <div id="lb-caption"></div>
</div>

<footer>Made with love</footer>

<script>
  const gallery = document.getElementById('gallery');
  const empty   = document.getElementById('empty');
  const lb      = document.getElementById('lightbox');
  const lbImg   = document.getElementById('lightbox-img');
  const lbCap   = document.getElementById('lb-caption');

  let images = [], current = 0;

  function label(src) {
    const name = src.split('/').pop().replace(/\.[^.]+$/, '');
    return name.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function openLightbox(idx) {
    current = idx;
    lbImg.src = images[current].src;
    lbImg.alt = images[current].title || label(images[current].src);
    lbCap.textContent = images[current].title || label(images[current].src);
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }

  function navigate(dir) {
    lbImg.classList.add('fading');
    setTimeout(() => {
      current = (current + dir + images.length) % images.length;
      lbImg.src = images[current].src;
      lbImg.alt = images[current].title || label(images[current].src);
      lbCap.textContent = images[current].title || label(images[current].src);
      lbImg.classList.remove('fading');
    }, 120);
  }

  document.getElementById('lb-close').onclick = closeLightbox;
  document.getElementById('lb-prev').onclick  = () => navigate(-1);
  document.getElementById('lb-next').onclick  = () => navigate(1);
  lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });

  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape')      closeLightbox();
    if (e.key === 'ArrowLeft')   navigate(-1);
    if (e.key === 'ArrowRight')  navigate(1);
  });

  fetch('images.json')
    .then(r => r.json())
    .then(data => {
      images = data;
      if (!images.length) { empty.style.display = 'block'; return; }
      images.forEach((img, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${img.src}" alt="${img.title || label(img.src)}" loading="lazy">
                          <div class="card-label">${img.title || label(img.src)}</div>`;
        card.onclick = () => openLightbox(idx);
        gallery.appendChild(card);
      });
    })
    .catch(() => { empty.style.display = 'block'; });
</script>
</body>
</html>
